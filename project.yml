# project.yml — xcodegen 工程描述文件
# 运行 `xcodegen generate` 自动生成 MerachWorkout.xcodeproj

name: MerachWorkout
options:
  deploymentTarget:
    iOS: "10.0"
  xcodeVersion: "13.4"
  defaultConfig: Release

targets:
  MerachWorkout:
    type: application
    platform: iOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.merach.workout
        SWIFT_VERSION: "5.5"
        TARGETED_DEVICE_FAMILY: "2"          # iPad only
        ARCHS: "$(ARCHS_STANDARD_32_64_BIT)" # 支持 armv7 (iPad 4)
        VALID_ARCHS: "arm64 armv7"
        IPHONEOS_DEPLOYMENT_TARGET: "10.0"
        UIRequiresFullScreen: YES
        ENABLE_BITCODE: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Merach Workout
        NSBluetoothAlwaysUsageDescription: 用于连接麦瑞克椭圆机
        NSBluetoothPeripheralUsageDescription: 用于连接麦瑞克椭圆机
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
