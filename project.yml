name: MerachWorkout
options:
  deploymentTarget:
    iOS: "12.0"
  xcodeVersion: "15.4"
  defaultConfig: Release

targets:
  MerachWorkout:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.merach.workout
        SWIFT_VERSION: "5.5"
        TARGETED_DEVICE_FAMILY: "1"           # iPhone
        ARCHS: "$(ARCHS_STANDARD)"
        VALID_ARCHS: "arm64"
        IPHONEOS_DEPLOYMENT_TARGET: "12.0"
        ENABLE_BITCODE: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Merach Workout
        NSBluetoothAlwaysUsageDescription: 用于连接麦瑞克椭圆机
        NSBluetoothPeripheralUsageDescription: 用于连接麦瑞克椭圆机
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
