name: Build MerachWorkout IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # 允许手动触发

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Move sources into Sources/ folder
        run: |
          mkdir -p Sources
          # 把根目录的 .swift 文件移进 Sources（如果还没在里面）
          for f in *.swift; do
            [ -f "$f" ] && mv "$f" Sources/ || true
          done

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # xcodegen latest generates objectVersion=77 (Xcode 16 format)
          # Patch it down to 56 so Xcode 15.4 can open it
          sed -i '' 's/objectVersion = 77/objectVersion = 56/' MerachWorkout.xcodeproj/project.pbxproj
          grep "objectVersion" MerachWorkout.xcodeproj/project.pbxproj

      - name: Build (unsigned — 越狱设备用 AppSync 安装无需签名)
        run: |
          xcodebuild \
            -project MerachWorkout.xcodeproj \
            -scheme MerachWorkout \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/MerachWorkout.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP="build/MerachWorkout.xcarchive/Products/Applications/MerachWorkout.app"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r MerachWorkout.ipa Payload/
          echo "IPA size: $(du -sh MerachWorkout.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerachWorkout-ipa
          path: MerachWorkout.ipa
          retention-days: 30
